---
- name: Verify filters
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Test map_format
      ansible.builtin.assert:
        that: result == expected
        fail_msg: "{{ result }}"
      vars:
        prefixes: ["a", "b"]
        suffix: "suffix"
        expected: "a:suffix,b:suffix"
        filter: "nephelaiio.plugins.map_format"
        result: "{{ prefixes | map(filter, '%s:' + suffix) | join(',') }}"

    - name: Test set_difference
      ansible.builtin.assert:
        that: result == expected
        fail_msg: "{{ result | to_json }}"
      vars:
        pairs: [[["a", "b"], ["b", "c"]]]
        expected: [["a"]]
        filter: "nephelaiio.plugins.set_difference"
        result: "{{ pairs | map(filter) }}"

    - name: Test inner_product
      ansible.builtin.assert:
        that: result == expected
        fail_msg: "{{ result | to_json }}"
      vars:
        pairs: [[["a", "b"], ["@c", "@d"]]]
        expected: [["a@c", "a@d", "b@c", "b@d"]]
        filter: "nephelaiio.plugins.inner_product"
        result: "{{ pairs | map(filter) | map('map', 'join') }}"

    - name: Test cons with a string
      ansible.builtin.assert:
        that: result == expected
        fail_msg: "{{ result | to_json }}"
      vars:
        expected: ["hello"]
        result: "{{ 'hello' | nephelaiio.plugins.cons }}"

    - name: Test cons with a number
      ansible.builtin.assert:
        that: result == expected
        fail_msg: "{{ result | to_json }}"
      vars:
        expected: [42]
        result: "{{ 42 | nephelaiio.plugins.cons }}"

    - name: Test cons with a dict
      ansible.builtin.assert:
        that: result == expected
        fail_msg: "{{ result | to_json }}"
      vars:
        value: { key: "value" }
        expected: [{ key: "value" }]
        result: "{{ value | nephelaiio.plugins.cons }}"

    - name: Test cons with map
      ansible.builtin.assert:
        that: result == expected
        fail_msg: "{{ result | to_json }}"
      vars:
        items: ["a", "b", "c"]
        expected: [["a"], ["b"], ["c"]]
        result: "{{ items | map('nephelaiio.plugins.cons') | list }}"

    - name: Set up combined filter input facts
      ansible.builtin.set_fact:
        _input: "{{ _db1 + _db2 }}"
      vars:
        _db1:
          - item: "db1"
            query_result:
              - oid: 17367
                srvacl: "{postgres=U/postgres,molecule=U/postgres,test=U/postgres}"
                srvfdw: 17349
                srvname: "serverA"
                srvoptions:
                  - "host=hostA"
                  - "dbname=remoteA"
                  - "fetch_size=100"
                  - "port=5433"
                  - "updatable=true"
                  - "truncatable=true"
                  - "application_name=appA"
                srvowner: 10
                srvtype: null
                srvversion: null
              - oid: 17368
                srvacl: "{postgres=U/postgres,molecule=U/postgres,test=U/postgres}"
                srvfdw: 17350
                srvname: "serverB"
                srvoptions:
                  - "host=hostB"
                  - "dbname=remoteB"
                  - "fetch_size=100"
                  - "port=5433"
                  - "updatable=true"
                  - "truncatable=true"
                  - "application_name=appB"
                srvowner: 10
                srvtype: null
                srvversion: null
        _db2:
          - item: "db2"
            query_result:
              - oid: 17369
                srvacl: "{postgres=U/postgres,molecule=U/postgres,test=U/postgres}"
                srvfdw: 17351
                srvname: "serverC"
                srvoptions:
                  - "host=hostC"
                  - "dbname=remoteC"
                  - "fetch_size=100"
                  - "port=5433"
                  - "updatable=true"
                  - "truncatable=true"
                  - "application_name=appC"
                srvowner: 10
                srvtype: null
                srvversion: null
              - oid: 17370
                srvacl: "{postgres=U/postgres,molecule=U/postgres,test=U/postgres}"
                srvfdw: 17352
                srvname: "serverD"
                srvoptions:
                  - "host=hostD"
                  - "dbname=remoteD"
                  - "fetch_size=100"
                  - "port=5433"
                  - "updatable=true"
                  - "truncatable=true"
                  - "application_name=appD"
                srvowner: 10
                srvtype: null
                srvversion: null

    - name: Format query data
      ansible.builtin.set_fact:
        _output: "{{ _data | flatten }}"
        _control:
          - foreign_server: "serverA"
            options:
              application_name: "appA"
              dbname: "remoteA"
              fetch_size: "100"
              host: "hostA"
              port: "5433"
              truncatable: "true"
              updatable: "true"
            source: "db1"
          - foreign_server: "serverB"
            options:
              application_name: "appB"
              dbname: "remoteB"
              fetch_size: "100"
              host: "hostB"
              port: "5433"
              truncatable: "true"
              updatable: "true"
            source: "db1"
          - foreign_server: "serverC"
            options:
              application_name: "appC"
              dbname: "remoteC"
              fetch_size: "100"
              host: "hostC"
              port: "5433"
              truncatable: "true"
              updatable: "true"
            source: "db2"
          - foreign_server: "serverD"
            options:
              application_name: "appD"
              dbname: "remoteD"
              fetch_size: "100"
              host: "hostD"
              port: "5433"
              truncatable: "true"
              updatable: "true"
            source: "db2"
      vars:
        _srvoptions: "{{ _input | map(attribute='query_result') | map('map', attribute='srvoptions') }}"
        _srvoptpairs: "{{ _srvoptions | map('map', 'map', 'split', '=') }}"
        _srvdata: "{{ _srvoptpairs | map('map', 'community.general.dict') }}"
        _options: "{{ _srvdata | map('map', 'nephelaiio.plugins.to_dict', 'options') }}"
        _sources: "{{ _input | map(attribute='item') | map('nephelaiio.plugins.to_dict', 'source') | map('nephelaiio.plugins.cons') }}"
        _srcopts: "{{ _sources | zip(_options) | map('nephelaiio.plugins.inner_product') | map('map', 'combine') }}"
        _fserverstrs: "{{ _input | map(attribute='query_result') | map('map', attribute='srvname') }}"
        _fservers: "{{ _fserverstrs | map('map', 'nephelaiio.plugins.to_dict', 'foreign_server') }}"
        _data: "{{ _srcopts | zip(_fservers) | map('nephelaiio.plugins.pairs') | map('map', 'combine') }}"

    - name: Verify output format
      ansible.builtin.assert:
        that: _output | symmetric_difference(_control) | length == 0
        fail_msg: "{{ _output | symmetric_difference(_control) | length }} mismatched elements found"
